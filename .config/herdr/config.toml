onboarding = false
# ==========================================
# Herdr Configuration
# ==========================================

[terminal]
# 新しいペイン/ワークスペースの作業ディレクトリを Herdr の起動時カレントディレクトリにする
new_cwd = "current"

[keys]
# tmuxと同様に Ctrl-a をプレフィックスにする
prefix = "ctrl+a"

# ペイン分割（左右分割 / 上下分割）
# tmuxの split-window -h (prefix+| または prefix+v) 相当
split_vertical = ["prefix+shift+backslash", "prefix+v"]
# tmuxの split-window -v (prefix+-) 相当
split_horizontal = "prefix+minus"

# vim風ペイン移動
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# ペインリサイズ (Prefix+r でリサイズモードに入り、hjklキーでサイズ調整)
resize_mode = "prefix+r"

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[experimental]
pane_history = true
