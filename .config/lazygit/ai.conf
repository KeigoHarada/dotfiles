# lazygit AI commit configuration
# プロバイダの選択肢: agy, copilot, gh
AI_PROVIDER=agy

# モデルの選択肢:
# --- agy ---
#   gemini-3.8-flash-low     (推奨: 最速・思考時間最小。コミットメッセージ生成に最適)
#   gemini-3.8-flash-medium  (標準バランス)
#   gemini-3.8-flash-high    (深い思考モード。高品質だが数〜十数秒かかる)
#   claude-sonnet-4-6        (Claude 思考モデル)
#   gpt-oss-120b-medium
# --- copilot ---
#   gpt-4o, claude-3.5-sonnet など
#
# 空欄またはコメントアウトした場合は、高速な gemini-3.8-flash-low が自動適用されます。
AI_MODEL=gemini-3.8-flash-low
